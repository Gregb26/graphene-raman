[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphene_raman"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "h5py", "matplotlib", "tqdm"]

[project.optional-dependencies]
mpi = ["mpi4py"]              # imported at module load by defects.local_R, local_G, non_local; needs an MPI library (rorqual: MPICH)
test = ["pytest"]
campaigns = ["ase", "spglib"]  # campagnes/R/R1, R2 (relaxation inputs and analysis)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphene_raman = ["plotting/*.mplstyle"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: more than ~10 s (deselect with -m 'not slow')",
    "needs_data: needs the local DFT data under data/graphene (skipped when absent)",
    "cluster: needs rorqual data (M matrices, scratch .save); skipped elsewhere",
]
